appId: com.slidemind.desktop
productName: SlideMind
copyright: Copyright © 2026 SlideMind

directories:
  output: out/release
  buildResources: assets

files:
  - &mainFiles out/main/**
  - &preloadFiles out/preload/**
  - &rendererFiles out/renderer/**
  - &packageFile package.json

extraResources:
  - from: skills
    to: skills
    filter:
      - '**/*'
  - from: LICENSE
    to: LICENSE
  - from: docs/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md

asar: true
electronLanguages:
  - en-US
  - en-GB
  - zh-CN
  - zh-TW
  - zh_CN
  - zh_TW
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  # Keep the allowlist: exclusion-only platform patterns also match project files.
  files:
    - *mainFiles
    - *preloadFiles
    - *rendererFiles
    - *packageFile
    - '!node_modules/@esbuild/!(darwin-${arch})/**/*'
  icon: assets/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  sign: false

win:
  files:
    - *mainFiles
    - *preloadFiles
    - *rendererFiles
    - *packageFile
    - '!node_modules/@esbuild/!(win32-${arch})/**/*'
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SlideMind

publish: null

afterPack: scripts/after-pack.mjs
